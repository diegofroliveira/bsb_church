<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IgrejaPro</title>
    <style>
      @keyframes igrejapro-spin {
        to { transform: rotate(360deg); }
      }
      .igrejapro-boot-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f9fafb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1e293b;
        padding: 1.5rem;
        text-align: center;
      }
      .igrejapro-boot-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 9999px;
        animation: igrejapro-spin 0.8s linear infinite;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="igrejapro-boot-loader">
        <div class="igrejapro-boot-spinner"></div>
        <div style="font-weight: 700; font-size: 1.125rem;">Igreja<span style="color: #2563eb;">Pro</span></div>
        <div style="font-size: 0.8125rem; color: #64748b; margin-top: 0.35rem;">Carregando painel...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
